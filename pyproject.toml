[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "socialdistance"
version = "2.0.0"
description = "Real-time social distance detection with YOLOv3 / SSD MobileNet, bird's-eye perspective mapping and proximity risk zones"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Aishwarya Ramanath Shanbhag" }]
dependencies = ["opencv-python>=4.8,<5", "numpy>=1.24"]

[project.scripts]
socialdistance = "socialdistance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
